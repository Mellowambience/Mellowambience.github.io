<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetherhaven Agentic MVP Demo</title>
  <link rel="stylesheet" href="./agentic/dockmaster.css" />
  <link rel="stylesheet" href="./agentic/forge-fuel.css" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 5%, rgba(168,85,247,.28), transparent 30rem),
        radial-gradient(circle at 80% 10%, rgba(103,232,249,.18), transparent 32rem),
        linear-gradient(180deg, #05030b, #090512 50%, #020104);
      color: #f8f3ff;
      font-family: system-ui, sans-serif;
      padding: 32px;
    }
    main { width: min(920px, 100%); }
    .card {
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 32px;
      background: rgba(255,255,255,.07);
      padding: clamp(24px, 5vw, 56px);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
    }
    h1 { font-size: clamp(3rem, 9vw, 7rem); line-height: .85; margin: 0 0 20px; letter-spacing: -.06em; }
    p { color: rgba(248,243,255,.72); font-size: 1.1rem; line-height: 1.7; max-width: 720px; }
    code { color: #67e8f9; }
  </style>
</head>
<body>
  <main class="card">
    <p>⟁ AETHERHAVEN COMMAND DECK // FORGE FUEL DEMO</p>
    <h1>Dockmaster<br />+ Forge Fuel.</h1>
    <p>Click the glowing orb for Dockmaster or the gold star for Forge Fuel. Try <code>/status</code>, <code>/fleet</code>, <code>/issues pet grave</code>, <code>/fuel</code>, or open Forge Fuel in Demo / No API key mode.</p>
  </main>
  <script src="./agentic/dockmaster.js" defer></script>
  <script src="./agentic/forge-fuel.js" defer></script>
</body>
</html>
